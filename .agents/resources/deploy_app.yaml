guide_title: SmugView Application Deployment & Packaging Guide
purpose: |
  Provides unified instructions to check for code changes, build the application, and deploy 
  to the running Android Emulator, optionally building and publishing the release Android App Bundle (.aab) to Google Play.

pre_requisite:
  - action: "Before initiating any deployment or bundle compile task, always execute the fast local unit tests first (e.g. `./gradlew testDebugUnitTest`) to verify codebase integrity."
  - action: "VERIFY the build actually succeeded — do not trust a piped command's exit code. `./gradlew ... | tail` reports tail's status, not Gradle's; grep for an explicit `BUILD SUCCESSFUL` line. A false 'build passed' before a Play upload ships broken bits."
  - action: "R8 is ENABLED for release (proguard-rules.pro keeps the reflective model packages). `assembleRelease` compiling clean does NOT prove JSON parses — smoke-test the release build on a device (load galleries + a search image) before publishing. See AGENTS.md 'Minification (R8)'."

environment_setup:
  JAVA_HOME: "C:\\Program Files\\Android\\Android Studio\\jbr"
  ANDROID_SDK: "$env:LOCALAPPDATA\\Android\\Sdk"

steps:
  1_check_changes:
    action: "Run `git status` to see if Kotlin, Gradle, or XML resource files have changed."
  2_check_emulator:
    action: "Verify if emulator is running and active using ADB."
    command: |
      $env:ANDROID_HOME="$env:LOCALAPPDATA\Android\Sdk"
      & "$env:ANDROID_HOME\platform-tools\adb.exe" devices
      & "$env:ANDROID_HOME\platform-tools\adb.exe" shell getprop sys.boot_completed
  3_select_target:
    options:
      - name: deploy_to_emulator
        description: "Deploy/install debug build to running emulator, and automatically start the application."
        condition: "Run if there are changes since last deploy, or if a clean emulator session is started."
        command: |
          $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
          ./gradlew installDebug
          
          # Auto-start application main activity
          $env:ANDROID_HOME="$env:LOCALAPPDATA\Android\Sdk"
          & "$env:ANDROID_HOME\platform-tools\adb.exe" shell am start -n com.smugview.app/.MainActivity
      - name: build_appbundle
        description: "Build release Android App Bundle (AAB) and provide clickable local link."
        command: |
          $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
          ./gradlew bundleRelease
        output_link: "app/build/outputs/bundle/release/app-release.aab"
      - name: publish_appbundle
        description: "Build release Android App Bundle (AAB) and push it directly to the Google Play Store internal track using Gradle Play Publisher."
        # SAFETY GATE: this uploads to Google Play. It is an irreversible, outward-facing action
        # and is therefore EXEMPT from AGENTS.md 'Silent/Direct Execution' mode.
        requires_explicit_confirmation: true
        gate: |
          STOP. Do not run this as part of a silent/batched execution sequence.
          Before running, you MUST:
            1. Confirm with the user, in this turn, that they want to publish to Google Play.
            2. Verify the versionCode was incremented in app/build.gradle.kts.
            3. Verify release notes exist for that versionCode under
               app/src/main/play/release-notes/en-US/<versionCode>.txt and have been reviewed.
          Prefer `build_appbundle` (local artifact, no upload) unless the user explicitly asked to publish.
          The dedicated `/publish_app` skill applies these same gates — use it for real releases.
        command: |
          $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
          ./gradlew publishReleaseBundle
      - name: publish_store_listing
        description: "Only update Play Store listings and release notes without rebuilding the app bundle."
        # Also outward-facing: mutates the public Play Store listing.
        requires_explicit_confirmation: true
        gate: "Confirm with the user before running; this changes the live Play Store listing."
        command: |
          $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
          ./gradlew publishListing
  4_fork_mitigation:
    action: "If installation fails with 'can't fork', reboot the emulator using ADB."
    command: |
      $env:ANDROID_HOME="$env:LOCALAPPDATA\Android\Sdk"
      & "$env:ANDROID_HOME\platform-tools\adb.exe" reboot
