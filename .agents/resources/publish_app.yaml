guide_title: SmugView Google Play Publishing Guide (via Gradle Play Publisher)
purpose: |
  Provides instructions to update the application version, sign the build,
  compile the release Android App Bundle (.aab), and publish to Google Play Console using Gradle Play Publisher.

pre_requisites:
  - "Release keystore configuration in local.properties"
  - "Google Play Console Service Account JSON file (play-service-account.json) placed in the project root"
  - "Gradle Play Publisher configured in app/build.gradle.kts"
  - "Release notes placed in app/src/main/play/release-notes/en-US/<versionCode>.txt"

steps:
  1_update_version:
    action: "Update versionCode and versionName in app/build.gradle.kts to the target version specified by the user."
  2_create_release_notes:
    action: "Verify or create a release notes file under app/src/main/play/release-notes/en-US/<versionCode>.txt containing the non-technical changelog for this version."
  3_review_release_notes:
    action: "Display the release notes content to the user and request their explicit review and confirmation before final publishing."
  4_verify_setup:
    action: "Verify that release signing configs are present in local.properties and play-service-account.json is in the root."
  5_run_tests:
    action: "Run unit tests before compile to ensure stability."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew testDebugUnitTest
  6_publish_internal:
    action: "Run Gradle Play Publisher to compile the release bundle, sign it, bundle the release notes, and upload it to the internal track."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew publishReleaseBundle
  7_publish_listings_only:
    action: "Upload only store listings and release notes without recompiling the app bundle."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew publishListing
