guide_title: SmugView Google Play Publishing Guide (via Gradle Play Publisher)
purpose: |
  Provides instructions to update the application version, sign the build,
  compile the release Android App Bundle (.aab), and publish to Google Play Console using Gradle Play Publisher.

pre_requisites:
  - "Release keystore configuration in local.properties"
  - "Google Play Console Service Account JSON file (play-service-account.json) placed in the project root"
  - "Gradle Play Publisher configured in app/build.gradle.kts"
  - "Release notes placed in app/src/main/play/release-notes/en-US/<versionCode>.txt"

steps:
  1_update_version:
    action: "Update versionCode and versionName in app/build.gradle.kts to the target version specified by the user."
  2_create_release_notes:
    action: "Verify or create a release notes file under app/src/main/play/release-notes/en-US/<versionCode>.txt containing the non-technical changelog for this version."
  3_review_release_notes:
    action: "Display the release notes content to the user and request their explicit review and confirmation before final publishing."
  4_verify_setup:
    action: "Verify that root local.properties contains a valid 'smugmug.api.key' (not placeholder) and that release signing configs are present in local.properties and play-service-account.json is in the root."
  5_run_tests:
    action: "Run unit tests before compile to ensure stability."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew testDebugUnitTest
  6_publish_internal:
    action: "Run Gradle Play Publisher to compile the release bundle, sign it, bundle the release notes, and upload it to the internal track."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew publishReleaseBundle
  7_publish_listings_only:
    action: "Upload only store listings and release notes without recompiling the app bundle."
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew publishListing
  8_promote_to_another_track:
    action: |
      To move an ALREADY-UPLOADED build (e.g. one sitting on internal) to another track (alpha/beta/production)
      WITHOUT rebuilding or bumping versionCode, use `promoteArtifact`, not `publishReleaseBundle`.
      `publishReleaseBundle` always performs a fresh bundle UPLOAD, which requires a brand-new, never-used
      versionCode — Google Play rejects re-uploading an existing versionCode to a different track (verified
      2026-07-18: "Version code is too low or has already been used"). `promoteArtifact` re-associates a
      versionCode Play already has on file with a new track via the Android Publisher API — no new artifact,
      no new versionCode.
    command: |
      $env:JAVA_HOME="C:\Program Files\Android\Android Studio\jbr"
      ./gradlew promoteArtifact --from-track internal --promote-track alpha --release-status draft
    gate: "Same as publishReleaseBundle — this is a real Play Console action. Confirm with the user before running."

known_issues:
  - name: "App is still in Play Console DRAFT status (as of 2026-07-18) — any non-internal-track release needs --release-status draft"
    detail: |
      Both `publishReleaseBundle` and `promoteArtifact` default to a `completed` release, which Play rejects
      with "Only releases with status draft may be created on draft app" for any track beyond internal, until
      the app clears the docs/PUBLISH.md §4 checklist (store listing, content rating, data safety form, etc.
      — internal testing tolerates an incomplete listing, closed/open/production tracks don't). Until that's
      cleared, pass `--release-status draft` (or `releaseStatus.set(ReleaseStatus.DRAFT)`) for alpha/beta/
      production pushes — the release lands in Play Console as a draft for the user to manually review and
      roll out. Re-check this the next time a non-internal publish is requested; if the checklist has since
      been completed, a normal `completed` status should work and this note can be removed.
