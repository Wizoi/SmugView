name: iOS spike (shared module)

# Stage 0 of docs/design/ios-cross-platform-and-app-store.md. Runs on the spike branch and by hand: it proves the shared module
# (kotlinx.serialization models, Ktor client, Room KMP database and migrations) on the JVM and on the iOS simulator, runs the real app in a
# simulator, and records how long the Kotlin/Native build takes. No secret is used: the tests read recorded answers from
# app/src/test/resources/parity.
#
# Cost (measured on run 41090034744, 3-core 7 GB macOS runner): the debug checks take about 8 minutes; the release link took 36 minutes,
# so it is its own job that runs only on demand, weekly, or when a commit message contains [release-link].
on:
  push:
    branches: [spike/ios]
    # Docs-only and Android-only commits do not need the iOS jobs. The tests read recorded answers from app/src/test/resources/parity.
    paths:
      - 'shared/**'
      - 'spikeui/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/src/test/resources/parity/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      release_link:
        description: 'Also link the release framework (about 36 minutes)'
        type: boolean
        default: false
      release_binary_cache:
        description: 'Release link: try kotlin.native.binary.enableReleaseBinaryCache (faster, changes the binary: a timing check, not a size number)'
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * 1' # Mondays: the release link still builds

# A newer push replaces a running one. A manual or scheduled run has its own group, so a push does not cancel a 36-minute link.
concurrency:
  group: ios-${{ github.event_name == 'push' && 'push' || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    # A dispatch that asks for the release link runs only that job.
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.release_link)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared module tests on the JVM
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest --stacktrace 2>&1 | tee jvm-build.log
      - name: Put the first errors and the test counts in the annotations
        if: always()
        run: |
          bash .github/scripts/annotate-log.sh jvm-build.log "jvm"
          python3 .github/scripts/report-tests.py shared/build/test-results jvm-tests
      - name: Fail the job when the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: shared/build/reports/tests

  # The macOS jobs wait for the cheap Linux one: a failure there stops them before they spend macOS minutes.
  ios-simulator:
    needs: jvm
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'spikeui/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Shared module tests on the iOS simulator
        id: tests
        continue-on-error: true
        env:
          # `simctl spawn` passes SIMCTL_CHILD_* to the test process without the prefix.
          SIMCTL_CHILD_PARITY_DIR: ${{ github.workspace }}/app/src/test/resources/parity
          SIMCTL_CHILD_SCHEMA_DIR: ${{ github.workspace }}/shared/schemas/com.smugview.app.data.db.AppDatabase
        run: |
          set -o pipefail
          start=$(date +%s)
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --no-configuration-cache --no-build-cache --stacktrace 2>&1 | tee ios-build.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "iosSimulatorArm64Test took $((end - start)) s (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      # Anyone can read annotations without logging in; the useful parts of the log go there.
      - name: Put the first errors in the annotations
        if: always()
        run: bash .github/scripts/annotate-log.sh ios-build.log
      - name: Report the iOS test results
        if: always()
        run: python3 .github/scripts/report-tests.py shared/build/test-results iOS-simulator-tests
      - name: Fail the job when the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: shared/build/reports/tests

  # The release framework link (Stage 0, step 5): size and time. Slow (36 minutes on the standard runner), so on demand, weekly, or when a
  # commit message contains [release-link]. It samples swap use every 30 s: the runner has 7 GB and the build gives the Kotlin/Native
  # compiler 5 GB, so swapping is the suspect behind the time. The Gradle JVM gets 1.5 GB here so the two do not compete for memory.
  ios-release-link:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_link) ||
      contains(github.event.head_commit.message, '[release-link]')
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'spikeui/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Link the release framework and measure it
        id: link
        continue-on-error: true
        run: |
          set -o pipefail
          cache_flag=""
          if [ "${{ inputs.release_binary_cache }}" = "true" ]; then cache_flag="-Pkotlin.native.binary.enableReleaseBinaryCache=true"; fi
          echo "release binary cache flag: '${cache_flag}'" | tee mem.log
          sysctl hw.memsize hw.ncpu 2>&1 | tee -a mem.log
          ( while true; do echo "$(date +%H:%M:%S) $(sysctl -n vm.swapusage)"; sleep 30; done ) >> mem.log 2>&1 &
          sampler=$!
          start=$(date +%s)
          ./gradlew :spikeui:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --no-configuration-cache --no-build-cache \
            -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8" $cache_flag 2>&1 | tee ios-link.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          kill $sampler 2>/dev/null || true
          vm_stat >> mem.log 2>&1
          kb=$(du -sk spikeui/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework 2>/dev/null | cut -f1)
          bin=$(find spikeui/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework -type f -name Shared -exec du -k {} + 2>/dev/null | cut -f1 | head -1)
          echo "::notice title=iOS release link (simulator arm64)::link took $((end - start)) s (exit $status, cache flag '${cache_flag}'), Shared.framework is ${kb:-0} KB, the binary ${bin:-0} KB"
          exit $status
      - name: Put the first errors and the swap samples in the annotations
        if: always()
        run: |
          [ -f ios-link.log ] && bash .github/scripts/annotate-log.sh ios-link.log release-link
          [ -f mem.log ] && bash .github/scripts/annotate-log.sh mem.log release-link-memory
          exit 0
      - name: Fail the job when the link failed
        if: steps.link.outcome == 'failure'
        run: exit 1

  # Stage 0, step 4 and Stage 2: the real app inside a tiny Xcode app, run on a simulator, with a screenshot. The PNG is pushed to the
  # branch `ios-spike-artifacts` (artifacts need a login to download; a branch can be read by anyone).
  ios-screen:
    needs: jvm
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The first boot of a simulator spends about 40 s on "data migration". Start it now so that happens while Gradle builds.
      - name: Start booting a simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "simulator: $UDID" | tee screen-run.log
          xcrun simctl boot "$UDID" 2>&1 | tee -a screen-run.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'spikeui/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build the Shared framework for the simulator
        id: framework
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :spikeui:linkDebugFrameworkIosSimulatorArm64 --no-daemon --no-configuration-cache --no-build-cache 2>&1 | tee screen-framework.log
      - name: Generate and build the Xcode project
        id: xcode
        if: steps.framework.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcode ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee screen-xcode.log
      - name: Run it on a simulator and take a screenshot
        id: run
        if: steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tee -a screen-run.log
          xcrun simctl install "$UDID" build/xcode/Build/Products/Debug-iphonesimulator/iosApp.app 2>&1 | tee -a screen-run.log
          xcrun simctl launch "$UDID" com.smugview.spike 2>&1 | tee -a screen-run.log
          sleep 12
          xcrun simctl io "$UDID" screenshot ios-spike-screen.png 2>&1 | tee -a screen-run.log
          ls -la ios-spike-screen.png | tee -a screen-run.log
      # Why the app is (not) on screen. Never fails the job: the screenshot above is what counts.
      - name: What the app did after launch
        if: always() && steps.xcode.outcome == 'success'
        continue-on-error: true
        run: |
          running=$(xcrun simctl spawn "$UDID" launchctl list | grep -ci "UIKitApplication:com.smugview" || true)
          echo "--- app processes running after launch: $running" | tee -a screen-run.log
          if [ "$running" = "0" ]; then
            { echo '--- app log (last 3 min)'; xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "iosApp"' | tail -150; } 2>&1 | tee -a screen-run.log || true
            { echo '--- crash reports'; ls ~/Library/Logs/DiagnosticReports/ 2>&1; for f in ~/Library/Logs/DiagnosticReports/iosApp*; do if [ -f "$f" ]; then echo "== $f"; head -c 6000 "$f"; fi; done; } 2>&1 | tee -a screen-run.log || true
          fi
          exit 0
      - name: Put the first errors in the annotations
        if: always()
        run: |
          for f in screen-framework.log screen-xcode.log screen-run.log; do
            [ -f "$f" ] && bash .github/scripts/annotate-log.sh "$f" "$f"
          done
          exit 0
      - name: Publish the screenshot to the ios-spike-artifacts branch
        if: steps.run.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/art" && cp ios-spike-screen.png "$RUNNER_TEMP/art/"
          cd "$RUNNER_TEMP/art"
          git init -q && git checkout -q -b ios-spike-artifacts
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add ios-spike-screen.png && git commit -q -m "iOS spike screenshot from run ${{ github.run_id }} (${{ github.sha }})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin ios-spike-artifacts
          echo "::notice title=screenshot::pushed to the ios-spike-artifacts branch"
      - name: Fail the job when a step failed
        if: steps.framework.outcome == 'failure' || steps.xcode.outcome == 'failure' || steps.run.outcome == 'failure'
        run: exit 1

  # Stage 0, step 5: the size of an unsigned release IPA for a real device (arm64). It links the release framework for the device (slow),
  # so it only runs when the commit message contains [ipa].
  ios-ipa-size:
    if: contains(github.event.head_commit.message, '[ipa]')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'spikeui/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      # Apple only accepts uploads built with Xcode 26 or later (iOS 26 SDK); the image's default is 16.4. This job is the proof that our
      # Kotlin/Native + Compose + XcodeGen build works with it, so the device build runs on Xcode 26.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build the unsigned release IPA for a device
        id: ipa
        continue-on-error: true
        run: |
          set -o pipefail
          start=$(date +%s)
          ./gradlew :spikeui:linkReleaseFrameworkIosArm64 --no-daemon --no-configuration-cache --no-build-cache -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8" 2>&1 | tee ipa-framework.log
          mid=$(date +%s)
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos             -destination 'generic/platform=iOS' -derivedDataPath build/xcode-device ARCHS=arm64 ONLY_ACTIVE_ARCH=YES             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ipa-xcode.log
          end=$(date +%s)
          mkdir -p ipa/Payload
          cp -R build/xcode-device/Build/Products/Release-iphoneos/iosApp.app ipa/Payload/
          (cd ipa && zip -qry spike.ipa Payload)
          ipa_kb=$(du -k ipa/spike.ipa | cut -f1)
          app_kb=$(du -sk ipa/Payload/iosApp.app | cut -f1)
          bin_kb=$(du -k ipa/Payload/iosApp.app/iosApp | cut -f1)
          fw_kb=$(du -sk spikeui/build/bin/iosArm64/releaseFramework/Shared.framework | cut -f1)
          echo "::notice title=iOS release IPA (device arm64, unsigned)::IPA ${ipa_kb} KB, .app ${app_kb} KB, app binary ${bin_kb} KB, Shared.framework (static, before the final link) ${fw_kb} KB; framework link $((mid - start)) s, Xcode build $((end - mid)) s"
      - name: Put the first errors in the annotations
        if: always()
        run: |
          for f in ipa-framework.log ipa-xcode.log; do
            [ -f "$f" ] && bash .github/scripts/annotate-log.sh "$f" "$f"
          done
          exit 0
      - name: Fail the job when the build failed
        if: steps.ipa.outcome == 'failure'
        run: exit 1
