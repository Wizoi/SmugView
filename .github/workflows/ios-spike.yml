name: iOS spike (shared module)

# Stage 0 of docs/design/ios-cross-platform-and-app-store.md. Runs only on the spike branch and by hand: it proves the shared module
# (kotlinx.serialization models, Ktor client, Room KMP database and migrations) on the JVM and on the iOS simulator, and records how long
# the Kotlin/Native build takes. No secret is used: the tests read recorded answers from app/src/test/resources/parity.
on:
  push:
    branches: [spike/ios]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared module tests on the JVM
        run: ./gradlew :shared:jvmTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: shared/build/reports/tests

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Shared module tests on the iOS simulator
        id: tests
        continue-on-error: true
        env:
          # `simctl spawn` passes SIMCTL_CHILD_* to the test process without the prefix.
          SIMCTL_CHILD_PARITY_DIR: ${{ github.workspace }}/app/src/test/resources/parity
          SIMCTL_CHILD_SCHEMA_DIR: ${{ github.workspace }}/shared/schemas/com.smugview.shared.db.AppDatabase
        run: |
          set -o pipefail
          start=$(date +%s)
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace 2>&1 | tee ios-build.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "iosSimulatorArm64Test took $((end - start)) s (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      # Anyone can read annotations without logging in; build logs need a login. So the useful parts of the log go there.
      - name: Put the first errors in the annotations
        if: always()
        run: bash .github/scripts/annotate-log.sh ios-build.log
      - name: Fail the job when the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: shared/build/reports/tests
