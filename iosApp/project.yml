name: iosApp
options:
  bundleIdPrefix: com.smugview
  deploymentTarget:
    iOS: "16.0"
packages:
  # The Google Cast sender SDK (decision 2 of docs/design/ios-casting.md: the dynamic flavour). Version read from Google's release notes.
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    dependencies:
      - package: GoogleCast
        product: GoogleCastStatic # experiment: the dynamic product double-defined GTMSessionFetcher (run 41141946510)
        embed: false # static: the binary is linked in; embedding the framework made App Store Connect reject its signature (TestFlight run 41167504875)
    # Compose Multiplatform refuses to start without this key (full refresh rate on ProMotion iPhones); found by the CI crash report of 2026-10-30.
    # SmugMugAPIKey is read by IosApp.kt; the build setting SMUGMUG_API_KEY is empty here and set by whoever builds a device test app.
    info:
      path: Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        # App Store Connect (run 41167504875): an iPad app that allows multitasking must list all four orientations. iPhone stays portrait.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        SmugMugAPIKey: $(SMUGMUG_API_KEY)
        # Cast discovery (Google's iOS permissions page): both services, and the sentence shown with the local-network prompt (decision 4).
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSLocalNetworkUsageDescription: SmugView looks for Chromecasts and other cast devices on your Wi-Fi so you can show photos on your TV.
        NSPhotoLibraryAddUsageDescription: SmugView saves the photos you download to your photo library.
        BGTaskSchedulerPermittedIdentifiers: ["com.smugview.app.newgalleries", "com.smugview.app.offline"]
        # The app only uses standard HTTPS, which is exempt from export documentation; this stops App Store Connect asking at every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: ["fetch", "processing"]
        # Casting: declare the external display scene role. No phone-scene entry is listed, so SwiftUI keeps its own; the delegate adaptor
        # (ExternalSceneDelegate.swift) supplies the configuration. Unverified how Xcode merges this with the generated manifest.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalSceneDelegate
    # Compose Multiplatform resources (the camera-brand logos in the photo info sheet). The framework is linked by Gradle on its own, so nothing
    # copies them into the app; without them the info sheet aborts the app ("Missing resource ... camera_canon.png", CI run 41209344892).
    # Needs `./gradlew :shared:assembleIosSimulatorArm64MainResources` (device: ...IosArm64MainResources) to have run first.
    postBuildScripts:
      - name: Copy Compose resources
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then T=iosArm64Main; else T=iosSimulatorArm64Main; fi
          SRC="$SRCROOT/../shared/build/generated/compose/resourceGenerator/assembledResources/$T/composeResources"
          DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/compose-resources/composeResources"
          if [ ! -d "$SRC" ]; then echo "error: $SRC is missing: run the Gradle assemble...MainResources task first"; exit 1; fi
          mkdir -p "$DST"
          rsync -a --delete "$SRC/" "$DST/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smugview.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmugView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SMUGMUG_API_KEY: ""
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../spikeui/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../spikeui/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-ObjC"]
