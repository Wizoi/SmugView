name: iosApp
options:
  bundleIdPrefix: com.smugview
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # Compose Multiplatform refuses to start without this key (full refresh rate on ProMotion iPhones); found by the CI crash report of 2026-10-30.
    # SmugMugAPIKey is read by IosApp.kt; the build setting SMUGMUG_API_KEY is empty here and set by whoever builds a device test app.
    info:
      path: Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        SmugMugAPIKey: $(SMUGMUG_API_KEY)
        NSPhotoLibraryAddUsageDescription: SmugView saves the photos you download to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smugview.spike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmugView spike
        SWIFT_VERSION: "5.0"
        SMUGMUG_API_KEY: ""
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../spikeui/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../spikeui/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
